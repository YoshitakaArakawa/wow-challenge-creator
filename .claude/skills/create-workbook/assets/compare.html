<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Draft vs Cloud</title>
<!--
  Refine-loop comparison page. Copied into outputs/{theme}/refine/ by iterate.ts; open it as a local file.
  Left: draft HTML from ./ (drafts revised during refine) and ../prototype/ (original prototypes).
  Right: the latest Cloud renders.
  Both lists come from compare-data.js, which iterate.ts rewrites every run. It is loaded through a script
  element rather than fetch() because browsers block fetch() on file:// pages.
-->
<style>
  :root { --bg:#f4f3ef; --ink:#222; --muted:#777; --line:#ddd; --panel:#fff; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#1e1e1c; --ink:#eee; --muted:#9a9a96; --line:#3a3a37; --panel:#2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui, sans-serif; }
  header { display:flex; gap:12px; align-items:center; padding:8px 16px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:1; }
  header select, header button { font:inherit; padding:4px 8px; }
  header .meta { color:var(--muted); margin-left:auto; }
  main { display:grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap:16px; padding:16px; height:calc(100vh - 45px); }
  section { display:flex; flex-direction:column; min-height:0; }
  h2 { margin:0 0 6px; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  iframe { flex:1; width:100%; border:1px solid var(--line); background:#fff; }
  .render { flex:1; overflow:auto; border:1px solid var(--line); background:#fff; padding:24px 32px; }
  .render img { width:100%; max-width:840px; display:block; margin:0 auto 24px; }
  .empty { color:var(--muted); padding:16px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; height:auto; } iframe { height:80vh; } }
</style>
</head>
<body>
<header>
  <label>Draft <select id="draft"></select></label>
  <button id="reload">Reload both</button>
  <span class="meta" id="meta"></span>
</header>
<main>
  <section><h2>Draft HTML</h2><iframe id="frame" title="Draft HTML"></iframe></section>
  <section><h2>Tableau Cloud render (refine/render)</h2><div class="render" id="render"></div></section>
</main>
<script>
const sel = document.getElementById("draft");
const frame = document.getElementById("frame");
const DATA_FILE = "compare-data.js";

// Re-inject the data script on every reload; the query string defeats the browser cache.
function loadData() {
  return new Promise((resolve) => {
    document.getElementById("compare-data")?.remove();
    window.COMPARE_DATA = null;
    const s = document.createElement("script");
    s.id = "compare-data";
    s.src = DATA_FILE + "?t=" + Date.now();
    s.onload = () => resolve(window.COMPARE_DATA);
    s.onerror = () => resolve(null);
    document.head.appendChild(s);
  });
}

function listDrafts(data) {
  const keep = sel.value;
  sel.innerHTML = "";
  const names = [];
  for (const group of data?.drafts ?? []) {
    if (!group.files.length) continue;
    const og = document.createElement("optgroup");
    og.label = group.label;
    for (const f of group.files) {
      og.appendChild(new Option(f.split("/").pop(), f));
      names.push(f);
    }
    sel.appendChild(og);
  }
  let remembered = null;
  try { remembered = localStorage.getItem("compare-draft"); } catch (e) { /* storage may be blocked */ }
  const preferred = keep || remembered;
  if (preferred && names.includes(preferred)) sel.value = preferred;
  if (!sel.options.length) sel.add(new Option("(no draft HTML in refine/ or prototype/)", ""));
}

function loadDraft() {
  frame.src = sel.value ? encodeURI(sel.value) + "?t=" + Date.now() : "about:blank";
}

function showRenders(data) {
  const box = document.getElementById("render");
  const meta = document.getElementById("meta");
  if (!data) {
    box.innerHTML = '<p class="empty">compare-data.js not found. Run iterate.ts.</p>';
    meta.textContent = "";
    return;
  }
  const renders = data.renders ?? [];
  box.innerHTML = renders.length ? "" : '<p class="empty">No renders yet. Run iterate.ts.</p>';
  for (const item of renders) {
    const img = new Image();
    img.alt = item.view;
    img.src = encodeURI(item.src) + "?t=" + Date.now();
    box.appendChild(img);
  }
  const pub = data.publish;
  if (!pub) { meta.textContent = "not published yet"; return; }
  const at = pub.at ? new Date(pub.at).toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" }) + " JST" : "";
  meta.textContent = (pub.ok ? pub.workbookName + " · published " : "last publish failed · ") + at;
}

async function reloadAll() {
  const data = await loadData();
  listDrafts(data);
  loadDraft();
  showRenders(data);
}

sel.addEventListener("change", () => {
  try { localStorage.setItem("compare-draft", sel.value); } catch (e) { /* per-viewer convenience only */ }
  loadDraft();
});
document.getElementById("reload").addEventListener("click", reloadAll);
reloadAll();
</script>
</body>
</html>
